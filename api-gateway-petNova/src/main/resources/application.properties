spring.application.name=api-gateway-petNova
server.port=8080

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# Habilitar el descubrimiento automático de rutas mediante Eureka
spring.cloud.gateway.discovery.locator.enabled=true
# Convierte el serviceId a minúsculas para coincidir con lo que registra Eureka
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

#Definir rutas
spring.cloud.gateway.routes[0].id=user-microservice
spring.cloud.gateway.routes[0].uri=lb://user-microservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/apiPetNova/auth/**, /apiPetNova/users/**

spring.cloud.gateway.routes[1].id=offices-microservice
spring.cloud.gateway.routes[1].uri=lb://offices-microservice
spring.cloud.gateway.routes[1].predicates[0]=Path=/apiPetNova/offices/**

spring.cloud.gateway.routes[2].id=pets-microservice
spring.cloud.gateway.routes[2].uri=lb://pets-microservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/apiPetNova/pets/**, /apiPetNova/vaccines/**

spring.cloud.gateway.routes[3].id=appointments-microservice
spring.cloud.gateway.routes[3].uri=lb://appointments-microservice
spring.cloud.gateway.routes[3].predicates[0]=Path=/apiPetNova/appointments/**

spring.cloud.gateway.routes[4].id=medicalHistories-microservice
spring.cloud.gateway.routes[4].uri=lb://medicalHistories-microservice
spring.cloud.gateway.routes[4].predicates[0]=Path=/apiPetNova/medicalHistories/**